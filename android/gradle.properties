# 原配置：org.gradle.jvmargs=-Xmx1024M -Dkotlin.daemon.jvm.options="-Xmx1g"
# 修改原因：Release 构建时 R8 出现 Java heap space 不足，提升 Gradle 与 Kotlin daemon 堆内存。
# 第一次尝试 4096M 时，本机可用物理内存不足导致 JVM native OOM，因此回落到 2048M。
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options="-Xmx1024M"
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
